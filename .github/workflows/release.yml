name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ToolBox.sln

      - name: Build
        run: dotnet build ToolBox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ToolBox.sln --configuration Release --no-build --no-restore

      - name: Publish Windows Host and plugin package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet restore src/ToolBox.Host/ToolBox.Host.csproj --runtime win-x64
          dotnet publish src/ToolBox.Host/ToolBox.Host.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o artifacts/publish
          & .\tools\New-KeyboardMousePackage.ps1 `
            -Configuration Release `
            -Version $version `
            -OutputDirectory .\artifacts
          Copy-Item -LiteralPath artifacts/publish/ToolBox.Host.exe `
            -Destination "artifacts/ToolBox-Host-$env:RELEASE_TAG-win-x64.exe"
          Get-FileHash -Algorithm SHA256 `
            -LiteralPath "artifacts/ToolBox-Host-$env:RELEASE_TAG-win-x64.exe", "artifacts/KeyboardMouse-$version.tpk" | `
            Set-Content -LiteralPath "artifacts/SHA256SUMS-$env:RELEASE_TAG.txt"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          gh release create $env:RELEASE_TAG `
            "artifacts/ToolBox-Host-$env:RELEASE_TAG-win-x64.exe" `
            "artifacts/KeyboardMouse-$version.tpk" `
            "artifacts/SHA256SUMS-$env:RELEASE_TAG.txt" `
            --title "ToolBox $env:RELEASE_TAG" `
            --generate-notes `
            --verify-tag
