<!doctype html>
<html lang="zh-CN" data-theme="violet" data-motion="on" data-transparency="on" data-radius="balanced">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>ToolBox · Bloom Space Preview</title>
  <style>
    :root {
      --bg: #0d1018;
      --bg-deep: #090b11;
      --surface: rgba(255, 255, 255, .072);
      --surface-strong: rgba(255, 255, 255, .115);
      --surface-soft: rgba(255, 255, 255, .042);
      --line: rgba(255, 255, 255, .13);
      --line-strong: rgba(255, 255, 255, .22);
      --text: #f2f4fa;
      --text-soft: #c1c8d6;
      --text-muted: #8993a5;
      --text-faint: #667184;
      --accent: #a99cff;
      --accent-strong: #c2b9ff;
      --accent-dark: #7568e2;
      --accent-wash: rgba(169, 156, 255, .16);
      --blue: #8cb7ff;
      --green: #72d7a3;
      --amber: #f2c873;
      --red: #ff8f9f;
      --shadow: 0 24px 75px rgba(0, 0, 0, .28);
      --shadow-small: 0 12px 32px rgba(0, 0, 0, .18);
      --radius-card: 16px;
      --radius-panel: 22px;
      --radius-button: 10px;
      --display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --body: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Code", "Consolas", monospace;
    }

    :root[data-theme="blue"] {
      --accent: #8cb7ff;
      --accent-strong: #b8d2ff;
      --accent-dark: #527dcc;
      --accent-wash: rgba(140, 183, 255, .16);
    }

    :root[data-theme="coral"] {
      --accent: #ff9f9c;
      --accent-strong: #ffc5bb;
      --accent-dark: #c76e78;
      --accent-wash: rgba(255, 159, 156, .15);
    }

    :root[data-theme="forest"] {
      --accent: #7ed4b1;
      --accent-strong: #b0f0d0;
      --accent-dark: #4caa86;
      --accent-wash: rgba(126, 212, 177, .15);
    }

    :root[data-radius="sharp"] { --radius-card: 10px; --radius-panel: 15px; --radius-button: 7px; }
    :root[data-radius="soft"] { --radius-card: 21px; --radius-panel: 28px; --radius-button: 13px; }
    :root[data-transparency="off"] { --surface: #171c28; --surface-strong: #202738; --surface-soft: #121722; --line: #30394b; }
    :root[data-motion="off"] *,
    :root[data-motion="off"] *::before,
    :root[data-motion="off"] *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }

    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body { margin: 0; color: var(--text); background: var(--bg-deep); font-family: var(--body); font-size: 14px; line-height: 1.45; }
    body.modal-open { overflow: hidden; }
    button, input, select { color: inherit; font: inherit; }
    button { border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
    input::placeholder { color: var(--text-faint); }
    svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { flex: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .app-shell { position: relative; min-height: 100vh; overflow: hidden; isolation: isolate; background: radial-gradient(circle at 15% 5%, rgba(104, 91, 210, .13), transparent 28%), radial-gradient(circle at 89% 86%, rgba(39, 124, 188, .12), transparent 28%), var(--bg); }
    .app-shell::before, .app-shell::after { content: ""; position: fixed; z-index: -2; width: 42vw; height: 42vw; border-radius: 50%; filter: blur(74px); opacity: .32; pointer-events: none; }
    .app-shell::before { top: -18vw; left: 27vw; background: rgba(124, 108, 244, .4); animation: float-a 27s ease-in-out infinite alternate; }
    .app-shell::after { right: -16vw; bottom: -20vw; background: rgba(74, 161, 220, .28); animation: float-b 34s ease-in-out infinite alternate; }
    .grain { position: fixed; z-index: -1; inset: 0; opacity: .035; pointer-events: none; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); }
    .topbar { position: sticky; z-index: 20; top: 0; display: grid; grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr); align-items: center; min-height: 76px; padding: 0 32px; border-bottom: 1px solid var(--line); background: rgba(13, 16, 24, .68); backdrop-filter: blur(26px) saturate(145%); -webkit-backdrop-filter: blur(26px) saturate(145%); }
    [data-transparency="off"] .topbar { background: #10141e; }
    .brand { display: inline-flex; align-items: center; gap: 12px; width: max-content; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,.25); border-radius: 11px; color: #fff; background: linear-gradient(145deg, var(--accent-strong), var(--accent-dark)); box-shadow: 0 8px 24px rgba(120, 104, 226, .35), inset 0 1px 0 rgba(255,255,255,.45); font: 700 11px/1 var(--mono); letter-spacing: -.08em; }
    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font: 650 15px/1.1 var(--display); letter-spacing: -.02em; }
    .brand-copy span { display: none; }
    .topnav { display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.045); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .nav-item { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 15px; border-radius: 9px; color: var(--text-muted); background: transparent; font-size: 13px; transition: background .22s ease, color .22s ease, transform .18s ease; }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,.065); }
    .nav-item.is-active { color: var(--text); background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 5px 18px rgba(0,0,0,.12); }
    .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 9px; }
    .health-pill, .top-button { display: inline-flex; align-items: center; gap: 8px; min-height: 35px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius-button); color: var(--text-soft); background: rgba(255,255,255,.045); font-size: 12px; }
    .health-pill { cursor: default; }
    .top-button:hover, .icon-button:hover { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,.1); }
    .icon-button { display: inline-grid; place-items: center; width: 35px; height: 35px; border: 1px solid var(--line); border-radius: var(--radius-button); color: var(--text-muted); background: rgba(255,255,255,.045); }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(114,215,163,.1); }
    .dot.amber { background: var(--amber); box-shadow: 0 0 0 4px rgba(242,200,115,.1); }
    .dot.red { background: var(--red); box-shadow: 0 0 0 4px rgba(255,143,159,.1); }
    .dot.gray { background: #778195; box-shadow: none; }

    .main { width: min(1440px, calc(100% - 64px)); margin: 0 auto; padding: 43px 0 70px; }
    .page { display: none; animation: page-in .35s cubic-bezier(.16,1,.3,1) both; }
    .page.is-active { display: block; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin-bottom: 34px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-strong); font: 700 11px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow::before { content: ""; display: inline-block; width: 22px; height: 1px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    h1, h2, h3, p { margin: 0; }
    .page-heading h1 { max-width: 680px; margin-top: 11px; font: 620 clamp(28px, 3.1vw, 40px)/1.08 var(--display); letter-spacing: -.06em; }
    .page-heading p { max-width: 500px; margin-top: 10px; color: var(--text-muted); font-size: 13px; line-height: 1.55; }
    .heading-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .primary-button, .secondary-button, .danger-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border-radius: var(--radius-button); transition: transform .18s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease; font-size: 13px; }
    .primary-button { color: #0d1018; background: var(--accent-strong); box-shadow: 0 9px 24px rgba(149,132,255,.24), inset 0 1px 0 rgba(255,255,255,.55); }
    .primary-button:hover { transform: translateY(-2px); background: #d5ceff; box-shadow: 0 13px 30px rgba(149,132,255,.35); }
    .secondary-button { border: 1px solid var(--line); color: var(--text-soft); background: rgba(255,255,255,.055); }
    .secondary-button:hover { transform: translateY(-2px); color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,.1); }
    .danger-button { color: #160c10; background: #ffb1bb; }
    .danger-button:hover { transform: translateY(-2px); background: #ffc6cc; }
    .button-small { min-height: 34px; padding: 0 11px; font-size: 12px; }
    .button-quiet { border: 1px solid var(--line); color: var(--text-muted); background: transparent; }

    .glass-panel { border: 1px solid var(--line); background: linear-gradient(135deg, rgba(255,255,255,.092), rgba(255,255,255,.038)); border-radius: var(--radius-panel); box-shadow: inset 0 1px 0 rgba(255,255,255,.09), var(--shadow-small); backdrop-filter: blur(24px) saturate(135%); -webkit-backdrop-filter: blur(24px) saturate(135%); }
    [data-transparency="off"] .glass-panel { background: #171c28; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .hero-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 18px; margin-bottom: 18px; }
    .hero-panel { position: relative; min-height: 202px; overflow: hidden; padding: 25px 27px; }
    .hero-panel::after { content: ""; position: absolute; right: -34px; bottom: -68px; width: 300px; height: 220px; border-radius: 50%; background: radial-gradient(ellipse, rgba(169,156,255,.34), transparent 68%); filter: blur(15px); pointer-events: none; }
    .hero-panel > .eyebrow, .health-panel .panel-kicker, .activity-side .panel-kicker { display: none; }
    .hero-panel h2 { max-width: 560px; margin-top: 0; font: 620 clamp(24px, 2.6vw, 33px)/1.12 var(--display); letter-spacing: -.055em; }
    .hero-panel p { max-width: 500px; margin-top: 11px; color: var(--text-muted); font-size: 12px; line-height: 1.55; }
    .hero-meta { position: relative; z-index: 1; display: flex; align-items: center; gap: 15px; margin-top: 21px; color: var(--text-soft); font-size: 11px; }
    .hero-meta span + span { padding-left: 15px; border-left: 1px solid var(--line); }
    .health-panel { padding: 24px; }
    .panel-kicker { color: var(--text-muted); font: 700 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    .health-panel h3 { margin-top: 0; font: 600 17px/1.2 var(--display); letter-spacing: -.03em; }
    .health-bar { display: flex; gap: 4px; margin: 18px 0 20px; }
    .health-bar span { height: 6px; flex: 1; border-radius: 5px; background: rgba(114,215,163,.8); box-shadow: 0 0 13px rgba(114,215,163,.16); }
    .health-bar span.warn { background: rgba(242,200,115,.84); box-shadow: none; }
    .health-list { display: grid; gap: 11px; }
    .health-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; color: var(--text-muted); font-size: 12px; }
    .health-row strong { color: var(--text-soft); font-weight: 600; }
    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 36px; }
    .stat-card { padding: 18px 19px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface-soft); }
    .stat-card span { display: block; color: var(--text-muted); font-size: 12px; }
    .stat-card strong { display: block; margin-top: 8px; font: 620 28px/1 var(--display); letter-spacing: -.055em; }
    .stat-card em { display: block; margin-top: 9px; color: var(--text-faint); font-size: 11px; font-style: normal; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 15px; }
    .section-head h2 { font: 600 20px/1.2 var(--display); letter-spacing: -.035em; }
    .section-head p { color: var(--text-muted); font-size: 12px; }
    .section-head .section-copy { display: flex; align-items: baseline; gap: 11px; }
    .text-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-strong); background: transparent; font-size: 12px; }
    .text-link:hover { color: #fff; }
    .overview-columns { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(310px, .72fr); gap: 18px; align-items: start; }
    .plugin-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .plugin-grid.compact-layout { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .plugin-grid .size-featured { grid-column: span 2; }

    .plugin-card { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 226px; overflow: hidden; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-card); background: linear-gradient(145deg, rgba(255,255,255,.095), rgba(255,255,255,.035)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 13px 32px rgba(0,0,0,.14); transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease, background .22s ease; animation: card-in .34s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--index, 0) * 42ms); }
    .plugin-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.24); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 20px 42px rgba(0,0,0,.22); }
    .plugin-card::after { content: ""; position: absolute; right: -72px; bottom: -93px; width: 220px; height: 190px; border-radius: 50%; background: radial-gradient(ellipse, var(--accent-wash), transparent 70%); pointer-events: none; }
    .plugin-card.status-faulted { border-color: rgba(255,143,159,.35); }
    .plugin-card.status-restart { border-color: rgba(242,200,115,.38); }
    .plugin-card.size-compact { min-height: 181px; }
    .plugin-card.size-compact .card-description, .plugin-card.size-compact .card-secondary, .plugin-card.size-compact .card-menu-wrap { display: none; }
    .plugin-card.size-compact .card-footer { margin-top: 22px; }
    .plugin-card.size-featured { min-height: 318px; grid-column: span 2; }
    .plugin-card.size-featured .card-description { max-width: 640px; }
    .plugin-card.size-featured .card-secondary { display: grid; }
    .card-header, .card-footer, .card-menu-wrap, .card-status { position: relative; z-index: 1; }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .plugin-identity { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .plugin-glyph { display: grid; place-items: center; flex: none; width: 39px; height: 39px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; color: var(--accent-strong); background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); font: 700 10px/1 var(--mono); letter-spacing: -.04em; }
    .plugin-type { min-width: 0; }
    .plugin-type strong { display: block; overflow: hidden; color: var(--text); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .plugin-type span { display: block; margin-top: 3px; overflow: hidden; color: var(--text-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .card-menu-wrap { position: relative; }
    .card-menu-button { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: var(--text-muted); background: transparent; }
    .card-menu-button:hover { color: var(--text); background: rgba(255,255,255,.09); }
    .card-menu { position: absolute; z-index: 5; top: 36px; right: 0; display: none; width: 162px; padding: 6px; border: 1px solid var(--line-strong); border-radius: 12px; background: #1b2130; box-shadow: var(--shadow-small); }
    .card-menu.is-open { display: block; animation: menu-in .17s ease both; }
    .card-menu button { display: flex; align-items: center; width: 100%; min-height: 31px; padding: 0 9px; border-radius: 7px; color: var(--text-soft); background: transparent; text-align: left; font-size: 12px; }
    .card-menu button:hover { color: var(--text); background: rgba(255,255,255,.09); }
    .card-menu .menu-divider { height: 1px; margin: 5px 3px; background: var(--line); }
    .card-title { position: relative; z-index: 1; margin-top: 21px; font: 620 20px/1.1 var(--display); letter-spacing: -.045em; }
    .card-description { position: relative; z-index: 1; min-height: 43px; margin-top: 18px; color: var(--text-muted); font-size: 12px; line-height: 1.6; }
    .size-compact .card-description { margin-top: 0; }
    .size-compact .card-last-action { display: none; }
    .card-status { display: flex; align-items: center; gap: 8px; margin-top: auto; color: var(--text-soft); font-size: 12px; }
    .status-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 25px; padding: 0 9px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.045); }
    .status-chip.running { color: var(--green); border-color: rgba(114,215,163,.18); background: rgba(114,215,163,.08); }
    .status-chip.streaming { color: var(--blue); border-color: rgba(140,183,255,.2); background: rgba(140,183,255,.08); }
    .status-chip.faulted { color: var(--red); border-color: rgba(255,143,159,.2); background: rgba(255,143,159,.08); }
    .status-chip.restart { color: var(--amber); border-color: rgba(242,200,115,.2); background: rgba(242,200,115,.08); }
    .status-chip.disabled { color: var(--text-muted); }
    .card-secondary { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 16px 0 17px; }
    .size-standard .card-secondary { display: grid; }
    .metric { min-width: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.09); }
    .metric span { display: block; overflow: hidden; color: var(--text-muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .metric strong { display: block; margin-top: 4px; overflow: hidden; color: var(--text-soft); font-size: 12px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .featured-list { display: none; grid-column: 1 / -1; gap: 7px; }
    .size-featured .featured-list { display: grid; }
    .featured-list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--text-muted); font-size: 11px; }
    .featured-list-row:last-child { border-bottom: 0; }
    .featured-list-row strong { color: var(--text-soft); font-weight: 500; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .card-action { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 0 11px; border-radius: 9px; color: #11131b; background: var(--accent-strong); font-size: 11px; font-weight: 600; }
    .card-action:hover { background: #d5ceff; }
    .card-action.secondary { color: var(--text-soft); border: 1px solid var(--line); background: rgba(255,255,255,.055); font-weight: 500; }
    .card-action.secondary:hover { color: var(--text); background: rgba(255,255,255,.1); }
    .card-action:disabled { cursor: wait; opacity: .56; }
    .card-last-action { color: var(--text-faint); font-size: 11px; }

    .activity-panel { padding: 22px; }
    .activity-panel .section-head { margin-bottom: 20px; }
    .activity-list { display: grid; gap: 0; }
    .activity-item { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 11px; align-items: start; padding: 15px 0; border-top: 1px solid var(--line); }
    .activity-icon { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; color: var(--accent-strong); background: var(--accent-wash); }
    .activity-icon .icon { width: 14px; height: 14px; }
    .activity-copy strong { display: block; color: var(--text-soft); font-size: 12px; font-weight: 600; }
    .activity-copy span { display: block; margin-top: 4px; overflow: hidden; color: var(--text-muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .activity-item time { color: var(--text-faint); font: 10px/1.4 var(--mono); white-space: nowrap; }
    .empty-panel { display: grid; place-items: center; min-height: 300px; padding: 35px; border: 1px dashed var(--line-strong); border-radius: var(--radius-panel); color: var(--text-muted); text-align: center; }
    .empty-panel .empty-icon { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 15px; border: 1px solid var(--line); border-radius: 17px; color: var(--accent-strong); background: var(--accent-wash); }
    .empty-panel strong { display: block; color: var(--text-soft); font-size: 15px; }
    .empty-panel p { max-width: 370px; margin-top: 8px; font-size: 12px; line-height: 1.7; }

    .page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 13px; margin-bottom: 22px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-card); background: rgba(255,255,255,.042); }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-tab { position: relative; min-height: 32px; padding: 0 11px; border-radius: 8px; color: var(--text-muted); background: transparent; font-size: 12px; transition: background .22s ease, color .22s ease, transform .18s ease; }
    .filter-tab:hover { color: var(--text); background: rgba(255,255,255,.07); }

    .overlay { position: fixed; z-index: 100; inset: 0; display: grid; place-items: center; padding: 48px 40px; background: rgba(4, 6, 10, .68); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: overlay-in .22s ease both; }

    .modal { display: flex; flex-direction: column; width: min(720px, calc(100vw - 80px)); height: min(620px, calc(100vh - 96px)); min-width: 560px; min-height: 420px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 20px; background: linear-gradient(145deg, rgba(30,36,52,.92), rgba(18,22,33,.94)); box-shadow: 0 35px 110px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.14); backdrop-filter: blur(30px) saturate(130%); -webkit-backdrop-filter: blur(30px) saturate(130%); animation: modal-in .27s cubic-bezier(.16,1,.3,1) both; }
    [data-transparency="off"] .modal { background: #1a202e; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .modal.small { width: min(560px, calc(100vw - 80px)); height: auto; min-width: 0; min-height: 0; }

    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 25px 27px 17px; }
    .modal-plugin-head { display: flex; align-items: center; gap: 13px; min-width: 0; }

    .modal-plugin-head p { margin-top: 5px; color: var(--text-muted); font-size: 11px; }
    .modal-close { display: grid; place-items: center; flex: none; width: 33px; height: 33px; border-radius: 9px; color: var(--text-muted); background: transparent; }
    .modal-close:hover { color: var(--text); background: rgba(255,255,255,.09); }
    .modal-tabs { display: flex; gap: 4px; padding: 0 27px; border-bottom: 1px solid var(--line); }
    .modal-tab { position: relative; min-height: 39px; padding: 0 10px; color: var(--text-muted); background: transparent; font-size: 12px; }
    .modal-tab:hover { color: var(--text); }
    .modal-tab.is-active { color: var(--text); }
    .modal-tab.is-active::after { content: ""; position: absolute; right: 9px; bottom: -1px; left: 9px; height: 2px; border-radius: 3px; background: var(--accent-strong); box-shadow: 0 0 14px rgba(169,156,255,.45); }

    .status-banner { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 15px; border: 1px solid rgba(114,215,163,.2); border-radius: 13px; background: linear-gradient(120deg, rgba(114,215,163,.11), rgba(255,255,255,.035)); }

    .status-banner.restart { border-color: rgba(242,200,115,.25); background: linear-gradient(120deg, rgba(242,200,115,.1), rgba(255,255,255,.035)); }
    .status-banner-copy strong { display: block; color: var(--text); font-size: 14px; font-weight: 650; }
    .status-banner-copy p { margin-top: 4px; color: var(--text-muted); font-size: 11px; }
    .block-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

    .block-label { color: var(--text-muted); font-size: 11px; }
    .block-value { margin-top: 7px; color: var(--text); font: 600 21px/1 var(--display); letter-spacing: -.04em; }

    .block-list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }

    .block-list-copy strong { display: block; color: var(--text-soft); font-size: 12px; font-weight: 600; }
    .block-list-copy span { display: block; margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .list-badge { flex: none; padding: 4px 7px; border-radius: 6px; color: var(--accent-strong); background: var(--accent-wash); font-size: 10px; }
    .progress-track { height: 7px; margin-top: 12px; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.08); }
    .progress-track span { display: block; width: 68%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-dark), var(--accent-strong)); box-shadow: 0 0 13px rgba(169,156,255,.35); }
    .field-stack { display: grid; gap: 7px; }

    .text-input, .select-input { width: 100%; min-height: 37px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; outline: 0; color: var(--text); background: rgba(0,0,0,.13); font-size: 12px; }
    .select-input { appearance: auto; background-color: #171d2a; }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .log-list { display: grid; gap: 0; }

    .log-row time { color: var(--text-faint); font: 10px var(--mono); }

    .about-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }

    .about-cell span { display: block; color: var(--text-muted); font-size: 10px; }
    .about-cell strong { display: block; margin-top: 6px; color: var(--text-soft); font: 500 12px var(--mono); }

    .stepper { display: flex; align-items: center; gap: 0; padding: 0 27px 20px; }

    .step.is-active, .step.is-done { color: var(--text-soft); }

    .package-choices { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }

    .package-choice .plugin-glyph { width: 32px; height: 32px; border-radius: 10px; }
    .package-choice strong { display: block; font-size: 12px; font-weight: 600; }
    .package-choice span { display: block; margin-top: 3px; color: var(--text-muted); font-size: 10px; }
    .validation-card { padding: 15px; border: 1px solid rgba(114,215,163,.25); border-radius: 12px; background: rgba(114,215,163,.07); }

    .validation-card strong { display: block; color: var(--text-soft); font-size: 13px; }
    .validation-card p { margin-top: 6px; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
    .manifest-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 13px; }
    .manifest-cell { padding: 10px; border-radius: 8px; background: rgba(0,0,0,.12); }

    .confirm-copy { padding: 2px 27px 25px; }

    .confirm-copy h2 { font: 620 23px/1.15 var(--display); letter-spacing: -.045em; }
    .confirm-copy p { max-width: 470px; margin-top: 9px; color: var(--text-muted); font-size: 13px; line-height: 1.7; }

    .toast-stack { position: fixed; z-index: 200; right: 26px; bottom: 25px; display: grid; gap: 9px; width: min(360px, calc(100vw - 40px)); pointer-events: none; }
    .toast { display: flex; align-items: flex-start; gap: 10px; padding: 13px 14px; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--text-soft); background: rgba(26,32,46,.92); box-shadow: var(--shadow-small); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); animation: toast-in .25s cubic-bezier(.16,1,.3,1) both; pointer-events: auto; font-size: 12px; }

    @keyframes float-a { from { transform: translate3d(-5vw, 1vh, 0) scale(.9); } to { transform: translate3d(8vw, 7vh, 0) scale(1.16); } }
    @keyframes float-b { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-12vw, -9vh, 0) scale(1.13); } }
    @keyframes page-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grid-in { from { opacity: .25; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes underline-in { from { opacity: 0; transform: scaleX(.25); } to { opacity: 1; transform: scaleX(1); } }
    @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlay-out { from { opacity: 1; } to { opacity: 0; } }
    @keyframes modal-in { from { opacity: 0; transform: translateY(10px) scale(.975); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes menu-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 1120px) {

    };

    function loadPreviewSettings() {

    const state = {

      filter: "all",
      search: "",
      sort: "recent",
      selectedPlugin: "audio",

      modalTab: "overview",

      activityTypeFilter: "all",

        { id: 1, plugin: "audio", type: "lifecycle", icon: "activity", title: "Phone Audio Relay 已运行", titleEn: "Phone Audio Relay is running", detail: "Worker 已连接，等待下一次设备操作。", detailEn: "Worker connected and waiting for the next device action.", time: "刚刚", timeEn: "now" },
        { id: 2, plugin: "hello", type: "lifecycle", icon: "check", title: "Hello Plugin 完成初始化", titleEn: "Hello Plugin finished initialization", detail: "资源 Lease 已准备，当前有 2 个后台任务。", detailEn: "Resource leases are ready with 2 background tasks.", time: "2 分钟前", timeEn: "2 min ago" },
        { id: 3, plugin: "network", type: "error", icon: "alert", title: "Network Notes 需要重试", titleEn: "Network Notes needs a retry", detail: "系统拒绝访问局域网扫描接口。", detailEn: "The system denied access to the local network scan interface.", time: "18 分钟前", timeEn: "18 min ago" },
        { id: 4, plugin: "clipboard", type: "lifecycle", icon: "power", title: "Clipboard Tools 已停用", titleEn: "Clipboard Tools was disabled", detail: "由用户手动停用，数据目录保留。", detailEn: "Disabled by the user; data directory retained.", time: "昨天", timeEn: "yesterday" }
      ],

    function t(key) { return compactCopy[state.language]?.[key] || translations[state.language]?.[key] || compactCopy.zh[key] || translations.zh[key] || key; }
    function icon(name) { return `<svg class="icon"><use href="#icon-${name}"></use></svg>`; }
    function currentPlugin() { return state.plugins.find(plugin => plugin.id === state.selectedPlugin) || state.plugins[0]; }
    function pluginById(id) { return state.plugins.find(plugin => plugin.id === id); }
    function statusLabel(status) { const map = { ready: "statusReady", running: "statusRunning", streaming: "statusStreaming", disabled: "statusDisabled", starting: "statusStarting", stopping: "statusStopping", searching: "statusSearching", connecting: "statusConnecting", faulted: "statusFaulted", restart: "statusRestart", uninstalling: "statusUninstalling", installFailed: "statusInstallFailed", deviceLost: "statusDeviceLost" }; return t(map[status] || "statusReady"); }
    function statusClass(status) { if (["running", "streaming"].includes(status)) return status === "streaming" ? "streaming" : "running"; if (["faulted", "installFailed", "deviceLost"].includes(status)) return "faulted"; if (status === "restart") return "restart"; if (status === "disabled") return "disabled"; return ""; }
    function statusDot(status) { const cls = statusClass(status); return `<span class="dot ${cls === "running" || cls === "streaming" ? "" : cls === "faulted" ? "red" : cls === "restart" ? "amber" : cls === "disabled" ? "gray" : "amber"}"></span>`; }
    function pluginName(plugin) { return state.language === "en" ? plugin.name : plugin.name; }

    function esc(value) { return String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char])); }

    function applyLanguage() {

      const search = document.querySelector("#plugin-search"); if (search) search.placeholder = state.language === "en" ? search.dataset.placeholderEn : search.dataset.placeholderZh;

    function renderStats() {
      const running = state.plugins.filter(plugin => ["running", "streaming", "starting", "connecting"].includes(plugin.status)).length;
      const attention = state.plugins.filter(plugin => ["faulted", "restart", "installFailed", "deviceLost"].includes(plugin.status)).length;
      document.querySelector("#overview-stats").innerHTML = [
        ["installedPlugins", state.plugins.length, "全部已发现"], ["filterRunning", running, "Worker 或业务运行中"], ["filterAttention", attention, "需要查看详情"], ["dataRetained", "100%", "Config 与 State"]
      ].map(([label, value, note]) => `<article class="stat-card"><span>${t(label)}</span><strong>${value}</strong><em>${state.language === "en" ? ({ "全部已发现":"All discovered", "Worker 或业务运行中":"Worker or task active", "需要查看详情":"Open to inspect", "Config 与 State":"Config & State" }[note] || note) : note}</em></article>`).join("");
    }

    function visiblePlugins() {
      let list = state.plugins.filter(plugin => {
        const matchesFilter = state.filter === "all" || state.filter === "running" && ["running", "streaming", "starting", "connecting"].includes(plugin.status) || state.filter === "disabled" && plugin.status === "disabled" || state.filter === "attention" && ["faulted", "restart", "installFailed", "deviceLost"].includes(plugin.status);
        const query = state.search.trim().toLowerCase();
        const matchesSearch = !query || [plugin.name, plugin.kind, plugin.publisher, plugin.id].some(value => value.toLowerCase().includes(query));
        return matchesFilter && matchesSearch;
      });
      if (state.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name));
      if (state.sort === "status") list.sort((a, b) => statusLabel(a.status).localeCompare(statusLabel(b.status)));
      return list;
    }

    function cardMarkup(plugin, index = 0) {

      const primaryLabel = primaryAction ? t(primaryAction) : statusLabel(plugin.status);
      return `<article class="plugin-card size-${size} status-${plugin.status}" style="--index:${index}" data-plugin-card="${plugin.id}">
        <div class="card-header"><div class="plugin-identity"><span class="plugin-glyph">${esc(plugin.glyph)}</span><div class="plugin-type"><strong>${esc(pluginName(plugin))}</strong><span>${esc(pluginKind(plugin))} · ${esc(plugin.publisher)}</span></div></div><div class="card-menu-wrap"><button class="card-menu-button" data-action="toggle-menu" data-plugin-id="${plugin.id}" aria-label="更多"><svg class="icon"><use href="#icon-more"/></svg></button><div class="card-menu" data-menu="${plugin.id}"><button data-action="open-details" data-plugin-id="${plugin.id}">${icon("arrow")} ${t("openDetails")}</button><button data-action="set-size" data-size="compact" data-plugin-id="${plugin.id}">${t("compact")}</button><button data-action="set-size" data-size="standard" data-plugin-id="${plugin.id}">${t("standard")}</button><button data-action="set-size" data-size="featured" data-plugin-id="${plugin.id}">${t("featured")}</button><button data-action="set-size" data-size="default" data-plugin-id="${plugin.id}">${t("resetDefault")}</button><div class="menu-divider"></div><button data-action="simulate-fault" data-plugin-id="${plugin.id}">${t("simulateFault")}</button><button data-action="simulate-restart" data-plugin-id="${plugin.id}">${t("simulateRestart")}</button></div></div></div>
        <p class="card-description">${esc(pluginDescription(plugin))}</p>
        <div class="card-secondary"><div class="metric"><span>${esc(plugin.metrics[0][0])}</span><strong>${esc(plugin.metrics[0][1])}</strong></div><div class="metric"><span>${esc(plugin.metrics[1][0])}</span><strong>${esc(plugin.metrics[1][1])}</strong></div><div class="featured-list">${plugin.list.map(row => `<div class="featured-list-row"><strong>${esc(row[0])}</strong><span>${esc(row[2])}</span></div>`).join("")}</div></div>
        <div class="card-status"><span class="status-chip ${statusClass(plugin.status)}">${statusDot(plugin.status)}${statusLabel(plugin.status)}</span><span class="card-last-action">${esc(state.language === "en" ? plugin.lastEn : plugin.last)}</span></div>
        <div class="card-footer"><span></span><div style="display:flex;gap:7px">${primaryAction ? `<button class="card-action secondary" data-action="plugin-action" data-plugin-id="${plugin.id}" data-plugin-action="${primaryAction}" ${isBusy ? "disabled" : ""}>${primaryLabel}</button>` : ""}<button class="card-action" data-action="open-details" data-plugin-id="${plugin.id}">${t("openDetails")}</button></div></div>
      </article>`;
    }

    function renderPluginGrids() {

    function renderSettings() {

        runtime: `<section class="settings-section glass-panel"><div class="settings-section-head"><div><h2>${t("dataRuntime")}</h2></div></div>${[["configPath","C:\\Users\\You\\AppData\\Local\\ToolBox\\Config"],["statePath","C:\\Users\\You\\AppData\\Local\\ToolBox\\State"],["logPath","C:\\Users\\You\\AppData\\Local\\ToolBox\\Logs"]].map(([key, value]) => `<div class="setting-row"><div class="setting-copy"><strong>${t(key)}</strong></div><div class="setting-control"><span class="path-chip">${value}</span><button class="secondary-button button-small" data-action="open-directory">${icon("folder")}${t("openDirectory")}</button></div></div>`).join("")}<div class="setting-row"><div class="setting-copy"><strong>${t("workerStatus")}</strong></div><div class="setting-control"><span class="status-chip running">${statusDot("running")}${t("noResidue")}</span></div></div><div class="setting-row"><div class="setting-copy"><strong>${t("resetSettings")}</strong></div><div class="setting-control"><button class="secondary-button button-small" data-action="reset-settings">${t("reset")}</button></div></div></section>`,

      };
      root.innerHTML = sections[section];
      document.querySelectorAll("[data-settings-section]").forEach(button => button.classList.toggle("is-active", button.dataset.settingsSection === section));

    function stopPlugin(id) { const plugin = pluginById(id); if (!plugin) return; plugin.status = "stopping"; plugin.last = "正在停止 Worker"; plugin.lastEn = "Stopping Worker"; render(); schedule(() => { plugin.status = "disabled"; plugin.last = "用户已停用"; plugin.lastEn = "Disabled by user"; addActivity(id, "lifecycle", "power", `${plugin.name} 已停用`, `${plugin.name} was disabled`, "Config 和 State 数据保留。", "Config and State data retained."); render(); showToast(`${plugin.name} ${t("statusDisabled")}`); }, 800); }

    function simulateState(id, target) { const plugin = pluginById(id); if (!plugin) return; plugin.status = target; plugin.last = target === "faulted" ? "Worker 无响应，等待重试" : "Host 要求重新启动插件"; plugin.lastEn = target === "faulted" ? "Worker is unresponsive; retry needed" : "Host requires a plugin restart"; addActivity(id, "error", "alert", target === "faulted" ? `${plugin.name} 进入 Faulted` : `${plugin.name} 需要重启`, target === "faulted" ? `${plugin.name} entered Faulted` : `${plugin.name} requires a restart`, target === "faulted" ? "Worker 没有在截止时间内响应。" : "运行环境或包版本要求重新启动。", target === "faulted" ? "Worker did not respond before the deadline." : "The runtime or package version requires a restart."); render(); showToast(target === "faulted" ? t("faultSimulated") : t("restartSimulated"), target === "faulted"); }

    function completeConfirm() { const confirm = state.confirm; const plugin = pluginById(confirm.pluginId); if (!plugin) return closeModal(); if (confirm.action === "enable") { closeModal(); startPlugin(plugin.id); return; } if (confirm.action === "uninstall") { plugin.status = "uninstalling"; plugin.last = t("uninstalling"); plugin.lastEn = "Uninstalling"; state.modal = null; state.confirm = null; render(); schedule(() => { const index = state.plugins.findIndex(item => item.id === plugin.id); if (index >= 0) state.plugins.splice(index, 1); if (state.selectedPlugin === plugin.id) state.selectedPlugin = state.plugins[0]?.id || ""; addActivity(plugin.id, "install", "trash", `${plugin.name} 已卸载`, `${plugin.name} was uninstalled`, "运行文件已移除，Config 和 State 数据保留。", "Runtime files removed; Config and State data retained."); render(); showToast(`${plugin.name} ${t("uninstallEvent")}`); }, 850); } }

    function finishInstall() { const pkg = installPackage(state.install.selected); const id = state.install.selected === "focus" ? "focus" : "mesh"; if (!state.plugins.some(plugin => plugin.id === id)) state.plugins.push({ id, glyph: id === "focus" ? "FT" : "MN", name: pkg.name, kind: id === "focus" ? "专注工具" : "网络工具", kindEn: id === "focus" ? "Focus utility" : "Network utility", publisher: pkg.publisher, version: pkg.version, status: "disabled", defaultSize: "standard", description: id === "focus" ? "用后台任务和进度区块帮助你专注完成一段工作。" : "记录局域网中的节点和备注，使用通用列表与操作区块。", descriptionEn: id === "focus" ? "A background task and progress workspace for focused sessions." : "A generic list and action workspace for local network notes.", metrics: [["任务", "0 个"], ["状态", "待启用"]], list: [["最近任务", "尚未运行", "空"], ["数据目录", "本地", "可用"]], last: "刚刚安装", lastEn: "Just installed", tabs: ["overview", "operations", "logs", "about"] }); addActivity(id, "install", "download", `${pkg.name} 已安装`, `${pkg.name} was installed`, "插件默认停用，等待用户手动启用。", "The plugin is disabled by default and awaits manual enable."); state.install.step = 4; render(); showToast(`${pkg.name} ${t("installSuccess")}`); }

    document.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.view) { selectView(button.dataset.view); return; }
      if (button.dataset.filter) { selectFilter(button.dataset.filter); return; }
      if (button.dataset.modalTab) { state.modalTab = button.dataset.modalTab; updatePluginModal(); return; }
      if (button.dataset.settingsSection) { state.settingsSection = button.dataset.settingsSection; render(); return; }
      if (button.dataset.langChoice) { state.language = button.dataset.langChoice; persist(); render(); return; }
      if (button.dataset.themeChoice) { state.settings.theme = button.dataset.themeChoice; persist(); render(); showToast(`${copy("主题", "Theme")} · ${themeOptions.find(theme => theme.id === state.settings.theme)?.[state.language === "en" ? "en" : "zh"] || state.settings.theme}`); return; }
      if (button.dataset.radiusChoice) { state.settings.radius = button.dataset.radiusChoice; persist(); render(); return; }
      if (button.dataset.brightnessChoice) { state.settings.brightness = button.dataset.brightnessChoice; persist(); render(); return; }
      if (button.dataset.sizeChoice) { state.settings.defaultSize = button.dataset.sizeChoice; persist(); render(); return; }
      if (button.dataset.settingToggle) { state.settings[button.dataset.settingToggle] = !state.settings[button.dataset.settingToggle]; persist(); render(); return; }
      if (button.dataset.packageChoice) { state.install.selected = button.dataset.packageChoice; state.install.validation = ["broken", "legacy"].includes(button.dataset.packageChoice) ? "invalid" : "valid"; render(); return; }
      const action = button.dataset.action;
      if (action === "reset-overview-title") { state.settings.overviewTitle = ""; persist(); render(); showToast(copy("工作区标题已恢复", "Workspace title reset")); return; }
      if (action === "toggle-select") { const select = button.closest(".menu-select"); document.querySelectorAll(".menu-select.is-open").forEach(item => { if (item !== select) item.classList.remove("is-open"); }); select?.classList.toggle("is-open"); button.setAttribute("aria-expanded", select?.classList.contains("is-open") ? "true" : "false"); return; }
      if (action === "choose-select") { const id = button.dataset.selectId; if (id === "plugin-sort") state.sort = button.dataset.selectValue; if (id === "activity-plugin-filter") state.activityPluginFilter = button.dataset.selectValue; if (id === "activity-type-filter") state.activityTypeFilter = button.dataset.selectValue; render(); return; }
      if (action === "toggle-menu") { const menu = document.querySelector(`[data-menu="${button.dataset.pluginId}"]`); document.querySelectorAll(".card-menu.is-open").forEach(item => { if (item !== menu) item.classList.remove("is-open"); }); menu?.classList.toggle("is-open"); return; }
      if (action === "set-size") { const plugin = pluginById(button.dataset.pluginId); if (button.dataset.size === "default") delete state.cardSizes[button.dataset.pluginId]; else state.cardSizes[button.dataset.pluginId] = button.dataset.size; persist(); render(); showToast(`${plugin?.name || "Plugin"} · ${t("sizeSaved")}`); return; }
      if (action === "open-details") { openPlugin(button.dataset.pluginId); return; }
      if (action === "plugin-action") { executePluginAction(button.dataset.pluginId, button.dataset.pluginAction); return; }
      if (action === "simulate-fault") { simulateState(button.dataset.pluginId, "faulted"); return; }
      if (action === "simulate-restart") { simulateState(button.dataset.pluginId, "restart"); return; }
      if (action === "close-modal") { closeModal(); return; }
      if (action === "install-next") { state.install.step = 2; render(); return; }
      if (action === "install-back") { state.install.step = 1; render(); return; }
      if (action === "confirm-install") { state.install.step = 3; render(); schedule(finishInstall, 1500); return; }
      if (action === "confirm-action") { completeConfirm(); return; }
      if (action === "open-install") { state.install = { step: 1, selected: "focus", validation: "valid", fileName: "" }; state.modal = "install"; render(); return; }
      if (action === "sync") { state.activities.unshift({ id: Date.now(), plugin: "toolbox", type: "lifecycle", icon: "refresh", title: "ToolBox 已同步插件状态", titleEn: "ToolBox synced plugin state", detail: "目录、Worker 和生命周期状态已刷新。", detailEn: "Directory, Worker and lifecycle state refreshed.", time: "刚刚", timeEn: "now" }); render(); showToast(t("syncDone")); return; }
      if (action === "clear-activity") { state.activities = []; render(); showToast(t("cleared")); return; }
      if (action === "simulate-fault-current") { simulateState(state.selectedPlugin, "faulted"); return; }
      if (action === "simulate-restart-current") { simulateState(state.selectedPlugin, "restart"); return; }
      if (action === "recover-current") { const plugin = currentPlugin(); if (plugin) { plugin.status = "ready"; plugin.last = "状态已恢复"; plugin.lastEn = "State restored"; render(); showToast(t("recovered")); } return; }
      if (action === "reset-settings") { state.settings = { ...defaultSettings }; persist(); render(); showToast(t("resetDone")); return; }
      if (action === "open-directory") { showToast(t("openDirectory")); return; }
      if (action === "open-link") { showToast("GitHub 链接将在正式构建中打开"); return; }
    });

    document.addEventListener("input", event => { if (event.target.id === "plugin-search") { state.search = event.target.value; render(); } if (event.target.id === "overview-title-input") { state.settings.overviewTitle = event.target.value.slice(0, 28); persist(); const title = document.querySelector("#overview-title"); if (title) title.textContent = state.settings.overviewTitle || t("overviewTitle"); const counter = document.querySelector("[data-title-counter]"); if (counter) counter.textContent = `${state.settings.overviewTitle.length}/28`; } });
    document.addEventListener("change", event => { if (event.target.id === "package-file") { const file = event.target.files?.[0]; if (!file) return; state.install.fileName = file.name; state.install.validation = file.name.toLowerCase().endsWith(".tpk") ? "valid" : "invalid"; render(); } });
    document.addEventListener("click", event => { if (!event.target.closest(".menu-select")) document.querySelectorAll(".menu-select.is-open").forEach(item => item.classList.remove("is-open")); });
    document.addEventListener("click", event => { if (event.target.matches("[data-overlay]")) { if (state.modal === "plugin" && ["starting", "stopping", "searching", "connecting", "uninstalling"].includes(currentPlugin()?.status)) return; closeModal(); } });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && state.modal) { if (state.modal === "plugin" && ["starting", "stopping", "searching", "connecting", "uninstalling"].includes(currentPlugin()?.status)) return; closeModal(); } });

    render();
  </script>
</body>
</html>
