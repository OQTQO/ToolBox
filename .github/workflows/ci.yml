name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ToolBox.sln

      - name: Build
        run: dotnet build ToolBox.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ToolBox.sln --configuration Release --no-build --no-restore
