name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          & .\tools\Invoke-ReleaseValidation.ps1 `
            -Configuration Release `
            -Version $version `
            -OutputDirectory .\artifacts\release-validation

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $releaseAssets = @(
            "artifacts/release-validation/ToolBox-Host-$env:RELEASE_TAG-win-x64.exe"
            "artifacts/release-validation/HelloPlugin-$version.tpk"
            "artifacts/release-validation/ToolBox-PluginDevKit-$version.zip"
            "artifacts/release-validation/SHA256SUMS-$env:RELEASE_TAG.txt"
          )

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "ToolBox $env:RELEASE_TAG" `
              --generate-notes `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $env:RELEASE_TAG @releaseAssets `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
